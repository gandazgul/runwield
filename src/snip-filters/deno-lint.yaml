name: "deno-lint"
version: 3
description: "Summarize successful deno lint output and keep only failure diagnostics"

match:
    command: "deno"
    subcommand: "lint"

streams:
    - stdout
    - stderr

pipeline:
    - action: "strip_ansi"
    - action: "match_output"
      pattern: "(?s).+"
      unless: "(?i)(error|warning|Found [1-9][0-9]* problems?|problem|failed)"
      message: "no lint errors"
    - action: "remove_lines"
      pattern: "^Checked [0-9]+ files?$"
    - action: "remove_lines"
      pattern: "^\\s*$"
    - action: "on_empty"
      message: "no lint errors"

on_error: "fail"

tests:
    - name: "empty output means success"
      input: ""
      expected: |
          no lint errors
    - name: "lint success is summarized"
      input: |
          Checked 2 files
      expected: |
          no lint errors
    - name: "lint error excludes successful checks"
      input: |
          Checked 40 files
          error[no-unused-vars]: `value` is never used
            --> /repo/src/file.js:1:7
             |
           1 | const value = 1;
             |       ^^^^^
          Found 1 problem
      expected: |
          error[no-unused-vars]: `value` is never used
            --> /repo/src/file.js:1:7
             |
           1 | const value = 1;
             |       ^^^^^
          Found 1 problem
