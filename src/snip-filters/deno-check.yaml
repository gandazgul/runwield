name: "deno-check"
version: 2
description: "Summarize successful deno check output and keep only failure diagnostics"

match:
    command: "deno"
    subcommand: "check"

streams:
    - stdout
    - stderr

pipeline:
    - action: "strip_ansi"
    - action: "match_output"
      pattern: "(?s).+"
      unless: "(?i)(error:|failed)"
      message: "type check passed"
    - action: "remove_lines"
      pattern: "^Check .+$"
    - action: "remove_lines"
      pattern: "^\\s*$"
    - action: "on_empty"
      message: "type check passed"

on_error: "fail"

tests:
    - name: "empty output means success"
      input: ""
      expected: |
          type check passed
    - name: "check success is summarized"
      input: |
          Check src/main.ts
          Check src/lib/example.ts
      expected: |
          type check passed
    - name: "check failure excludes successful checks"
      input: |
          Check src/file.js
          error: TS2322 [ERROR]: Type 'string' is not assignable to type 'number'.
          const value = "nope";
                ~~~~~
              at file:///repo/src/file.js:1:7
      expected: |
          error: TS2322 [ERROR]: Type 'string' is not assignable to type 'number'.
          const value = "nope";
                ~~~~~
              at file:///repo/src/file.js:1:7
