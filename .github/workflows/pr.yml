name: pr-gate

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pr-gate-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    gate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Setup Go for Snip
              uses: actions/setup-go@v6
              with:
                  go-version: "1.25.x"
                  cache: false

            - name: Prepare source-quality environment
              run: |
                  git checkout -B main "$GITHUB_SHA"
                  mkdir -p "$RUNNER_TEMP/runwield-ci-bin"
                  for binary in mnemoteca cymbal ketch; do
                    cat > "$RUNNER_TEMP/runwield-ci-bin/$binary" <<'EOF'
                  #!/usr/bin/env bash
                  if [[ "$1" == "--help" ]]; then exit 0; fi
                  printf '%s test stub\n' "$(basename "$0")"
                  EOF
                    chmod +x "$RUNNER_TEMP/runwield-ci-bin/$binary"
                  done
                  GOBIN="$RUNNER_TEMP/runwield-ci-bin" go install github.com/edouard-claude/snip/cmd/snip@v0.24.1
                  deno run -A scripts/write-version.js
                  PATH="$RUNNER_TEMP/runwield-ci-bin:$PATH" deno run -A src/cli.ts snip-filters install
                  echo "$RUNNER_TEMP/runwield-ci-bin" >> "$GITHUB_PATH"

            # One task, so the gate a contributor runs locally and the gate GitHub
            # runs cannot drift: source quality first, then the Golden TUI
            # portfolio that `deno task ci` no longer carries.
            - name: Run PR gate
              run: deno task pr:check

            - name: Print PR gate failure logs
              if: failure()
              run: |
                  for log in /tmp/tests-failure-*.log; do
                    if [[ -f "$log" ]]; then
                      echo "::group::$log"
                      cat "$log"
                      echo "::endgroup::"
                    fi
                  done
