name: golden-tui

on:
    push:
        branches:
            - main
            - "release/**"
    workflow_dispatch:
        inputs:
            concurrency:
                description: Isolated test processes to run at once
                required: false
                default: "3"
                type: choice
                options:
                    - "3"
                    - "4"

permissions:
    contents: read

concurrency:
    group: golden-tui-${{ github.ref }}
    cancel-in-progress: true

jobs:
    golden:
        runs-on: ubuntu-latest
        env:
            WLD_TEST_DENO_DIR: /tmp/runwield-deno-dir

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Setup Go for Snip
              uses: actions/setup-go@v6
              with:
                  go-version: "1.25.x"
                  cache: false

            - name: Restore Deno dependency cache
              uses: actions/cache@v4
              with:
                  path: /tmp/runwield-deno-dir
                  key: deno-tests-${{ runner.os }}-${{ hashFiles('deno.lock') }}

            - name: Restore Golden timing history
              uses: actions/cache/restore@v4
              with:
                  path: .ci-cache/golden-timings.json
                  key: golden-timings-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      golden-timings-${{ runner.os }}-

            - name: Prepare Golden environment
              run: |
                  mkdir -p "$RUNNER_TEMP/runwield-ci-bin"
                  for binary in mnemoteca cymbal ketch; do
                    cat > "$RUNNER_TEMP/runwield-ci-bin/$binary" <<'EOF'
                  #!/usr/bin/env bash
                  if [[ "$1" == "--help" ]]; then exit 0; fi
                  printf '%s test stub\n' "$(basename "$0")"
                  EOF
                    chmod +x "$RUNNER_TEMP/runwield-ci-bin/$binary"
                  done
                  GOBIN="$RUNNER_TEMP/runwield-ci-bin" go install github.com/edouard-claude/snip/cmd/snip@v0.24.1
                  deno run -A scripts/write-version.js
                  PATH="$RUNNER_TEMP/runwield-ci-bin:$PATH" deno run -A src/cli.ts snip-filters install
                  echo "$RUNNER_TEMP/runwield-ci-bin" >> "$GITHUB_PATH"

            - name: Run Golden TUI gate
              env:
                  WLD_TEST_CONCURRENCY: ${{ inputs.concurrency || '3' }}
              run: deno task test:golden-tui --timings-file .ci-cache/golden-timings.json

            - name: Save Golden timing history
              if: always() && hashFiles('.ci-cache/golden-timings.json') != ''
              uses: actions/cache/save@v4
              with:
                  path: .ci-cache/golden-timings.json
                  key: golden-timings-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Retain Golden timing report
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: golden-timings-${{ github.run_attempt }}
                  path: .ci-cache/golden-timings.json
                  if-no-files-found: ignore

            - name: Print Golden failure logs
              if: failure()
              run: |
                  for log in /tmp/tests-failure-*.log; do
                    if [[ -f "$log" ]]; then
                      echo "::group::$log"
                      cat "$log"
                      echo "::endgroup::"
                    fi
                  done

            - name: Retain Golden failure evidence
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: golden-failure-${{ github.run_attempt }}
                  include-hidden-files: true
                  path: |
                      /tmp/tests-failure-*.log
                      /tmp/runwield-test-sandboxes-*-evidence/**
