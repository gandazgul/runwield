name: release-wld

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: Existing immutable release tag to recover
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: release-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    metadata:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.metadata.outputs.tag }}
            kind: ${{ steps.metadata.outputs.kind }}
            build_version: ${{ steps.metadata.outputs.build_version }}
            prerelease: ${{ steps.metadata.outputs.prerelease }}
            make_latest: ${{ steps.metadata.outputs.make_latest }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Validate release metadata
              id: metadata
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  deno task release:metadata --tag "$RELEASE_TAG" > metadata.json
                  deno eval '
                    const metadata = JSON.parse(await Deno.readTextFile("metadata.json"));
                    if (metadata.tag !== Deno.env.get("RELEASE_TAG")) throw new Error("metadata tag mismatch");
                    const lines = [
                      `tag=${metadata.tag}`,
                      `kind=${metadata.kind}`,
                      `build_version=${metadata.buildVersion}`,
                      `prerelease=${metadata.prerelease}`,
                      `make_latest=${metadata.makeLatest}`,
                    ];
                    await Deno.writeTextFile(Deno.env.get("GITHUB_OUTPUT"), lines.join("\n") + "\n", { append: true });
                  '

    ci:
        runs-on: ubuntu-latest
        needs: metadata

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Setup Go for Snip
              uses: actions/setup-go@v6
              with:
                  go-version: "1.25.x"
                  cache: false

            - name: Prepare source-quality environment
              run: |
                  git checkout -B main "$GITHUB_SHA"
                  mkdir -p "$RUNNER_TEMP/runwield-ci-bin"
                  for binary in mnemoteca cymbal ketch; do
                    cat > "$RUNNER_TEMP/runwield-ci-bin/$binary" <<'EOF'
                  #!/usr/bin/env bash
                  if [[ "$1" == "--help" ]]; then exit 0; fi
                  printf '%s test stub\n' "$(basename "$0")"
                  EOF
                    chmod +x "$RUNNER_TEMP/runwield-ci-bin/$binary"
                  done
                  GOBIN="$RUNNER_TEMP/runwield-ci-bin" go install github.com/edouard-claude/snip/cmd/snip@v0.24.1
                  deno run -A scripts/write-version.js
                  PATH="$RUNNER_TEMP/runwield-ci-bin:$PATH" deno run -A src/cli.ts snip-filters install
                  echo "$RUNNER_TEMP/runwield-ci-bin" >> "$GITHUB_PATH"

            - name: Run source-quality gate
              timeout-minutes: 15
              run: deno task ci

            - name: Print source-quality failure logs
              if: failure()
              run: |
                  for log in /tmp/tests-failure-*.log; do
                    if [[ -f "$log" ]]; then
                      echo "::group::$log"
                      cat "$log"
                      echo "::endgroup::"
                    fi
                  done

    release-check:
        runs-on: ubuntu-latest
        needs:
            - metadata
            - ci

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.tag }}
                  submodules: recursive

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Setup Go for Snip
              uses: actions/setup-go@v6
              with:
                  go-version: "1.25.x"
                  cache: false

            # Release qualification runs the Golden TUI portfolio, and the test
            # runner shells through Snip, so this job needs the same helper
            # binaries as the source-quality gate.
            - name: Prepare release qualification environment
              run: |
                  mkdir -p "$RUNNER_TEMP/runwield-ci-bin"
                  for binary in mnemoteca cymbal ketch; do
                    cat > "$RUNNER_TEMP/runwield-ci-bin/$binary" <<'EOF'
                  #!/usr/bin/env bash
                  if [[ "$1" == "--help" ]]; then exit 0; fi
                  printf '%s test stub\n' "$(basename "$0")"
                  EOF
                    chmod +x "$RUNNER_TEMP/runwield-ci-bin/$binary"
                  done
                  GOBIN="$RUNNER_TEMP/runwield-ci-bin" go install github.com/edouard-claude/snip/cmd/snip@v0.24.1
                  deno run -A scripts/write-version.js
                  PATH="$RUNNER_TEMP/runwield-ci-bin:$PATH" deno run -A src/cli.ts snip-filters install
                  echo "$RUNNER_TEMP/runwield-ci-bin" >> "$GITHUB_PATH"

            - name: Cache dependencies
              run: deno cache --reload scripts/release-check.js

            - name: Run release qualification check
              env:
                  WLD_BUILD_VERSION: ${{ needs.metadata.outputs.build_version }}
              run: deno task release:check --build-version "${{ needs.metadata.outputs.build_version }}"

            - name: Print release qualification failure logs
              if: failure()
              run: |
                  for log in /tmp/tests-failure-*.log; do
                    if [[ -f "$log" ]]; then
                      echo "::group::$log"
                      cat "$log"
                      echo "::endgroup::"
                    fi
                  done

    build:
        runs-on: ubuntu-latest
        needs:
            - metadata
            - release-check
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: aarch64-apple-darwin
                      asset_suffix: darwin-arm64
                      binary_name: wld
                    - target: x86_64-apple-darwin
                      asset_suffix: darwin-x64
                      binary_name: wld
                    - target: x86_64-unknown-linux-gnu
                      asset_suffix: linux-x64
                      binary_name: wld
                    - target: aarch64-unknown-linux-gnu
                      asset_suffix: linux-arm64
                      binary_name: wld
                    - target: x86_64-pc-windows-msvc
                      asset_suffix: windows-x64
                      binary_name: wld.exe

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.tag }}
                  submodules: recursive

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Generate version file
              env:
                  WLD_BUILD_VERSION: ${{ needs.metadata.outputs.build_version }}
              run: deno run -A scripts/write-version.js

            - name: Cache dependencies
              run: deno cache scripts/compile.js src/cli.ts

            - name: Compile binary
              env:
                  WLD_BUILD_VERSION: ${{ needs.metadata.outputs.build_version }}
              run: deno run -A scripts/compile.js --target "${{ matrix.target }}" --output "${{ matrix.binary_name }}"

            - name: Smoke test native binary
              if: matrix.target == 'x86_64-unknown-linux-gnu'
              run: |
                  ./wld --version | tee version.txt
                  grep -F "runwield ${{ needs.metadata.outputs.build_version }} (" version.txt

            - name: Package artifact
              run: |
                  VERSION="${{ needs.metadata.outputs.build_version }}"
                  ASSET_BASE="wld-${VERSION}-${{ matrix.asset_suffix }}"
                  tar -czf "${ASSET_BASE}.tar.gz" "${{ matrix.binary_name }}"
                  tar -cf - "${{ matrix.binary_name }}" | zstd -10 -T0 -o "${ASSET_BASE}.tar.zst"
                  sha256sum "${ASSET_BASE}.tar.gz" > "${ASSET_BASE}.tar.gz.sha256"
                  sha256sum "${ASSET_BASE}.tar.zst" > "${ASSET_BASE}.tar.zst.sha256"
                  if [[ "${{ matrix.asset_suffix }}" == "windows-x64" ]]; then
                    deno task package:windows --tag "$VERSION" --binary "${{ matrix.binary_name }}" --output .
                  fi

            - name: Upload build artifact
              uses: actions/upload-artifact@v5
              with:
                  name: wld-${{ matrix.asset_suffix }}
                  path: |
                      *.tar.gz
                      *.tar.zst
                      *.zip
                      *.json
                      *.sha256

    windows-package-check:
        runs-on: windows-latest
        needs:
            - metadata
            - build

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.tag }}

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Download Windows package artifact
              uses: actions/download-artifact@v5
              with:
                  name: wld-windows-x64
                  path: windows-package

            - name: Run native Windows package checks
              shell: pwsh
              run: |
                  $zip = Get-ChildItem windows-package -Filter "wld-*-windows-x64.zip" | Select-Object -First 1
                  if (-not $zip) { throw "Windows package ZIP not found" }
                  deno task package:windows:check --package $zip.FullName

    release:
        runs-on: ubuntu-latest
        needs:
            - metadata
            - build
            - windows-package-check

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.tag }}

            - name: Download matrix artifacts
              uses: actions/download-artifact@v5
              with:
                  path: release-artifacts
                  pattern: wld-*
                  merge-multiple: false

            - name: Consolidate checksums
              run: |
                  find release-artifacts -name "*.sha256" -exec cat {} \; > release-artifacts/SHA256SUMS

            - name: Publish release assets
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.metadata.outputs.tag }}
                  prerelease: ${{ needs.metadata.outputs.prerelease }}
                  make_latest: ${{ needs.metadata.outputs.make_latest }}
                  preserve_order: true
                  overwrite_files: true
                  files: |
                      release-artifacts/**/*.tar.gz
                      release-artifacts/**/*.tar.zst
                      release-artifacts/**/*.zip
                      release-artifacts/**/*.json
                      release-artifacts/**/*.sha256
                      release-artifacts/SHA256SUMS
                      config.schema.json

    winget-package:
        runs-on: ubuntu-latest
        if: needs.metadata.outputs.kind == 'stable'
        needs:
            - metadata
            - release

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.metadata.outputs.tag }}

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Render WinGet manifest artifact
              run: |
                  deno task package:winget --tag "${{ needs.metadata.outputs.tag }}" --output winget-manifests
                  tar -czf "runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz" -C winget-manifests .
                  shasum -a 256 "runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz" > "runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz.sha256"

            - name: Upload WinGet manifest artifact
              uses: actions/upload-artifact@v5
              with:
                  name: runwield-winget-manifests-${{ needs.metadata.outputs.tag }}
                  path: |
                      runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz
                      runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz.sha256

    winget-submit:
        runs-on: windows-latest
        if: needs.metadata.outputs.kind == 'stable'
        needs:
            - metadata
            - winget-package

        steps:
            - name: Download WinGet manifest artifact
              uses: actions/download-artifact@v5
              with:
                  name: runwield-winget-manifests-${{ needs.metadata.outputs.tag }}
                  path: winget-package

            - name: Submit WinGet pull request
              shell: pwsh
              env:
                  WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
                      throw "WINGET_CREATE_GITHUB_TOKEN is not configured"
                  }

                  $version = "${{ needs.metadata.outputs.build_version }}".TrimStart("v")
                  $prTitle = "New version: Gandazgul.RunWield version $version"
                  $headers = @{
                      Authorization = "Bearer $env:WINGET_CREATE_GITHUB_TOKEN"
                      Accept = "application/vnd.github+json"
                      "X-GitHub-Api-Version" = "2022-11-28"
                  }

                  $catalogUri = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/g/Gandazgul/RunWield/$version"
                  try {
                      Invoke-RestMethod $catalogUri -Headers $headers -ErrorAction Stop | Out-Null
                      Write-Host "Gandazgul.RunWield $version is already in the WinGet catalog; submission is complete."
                      exit 0
                  } catch {
                      if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
                  }

                  $query = [uri]::EscapeDataString("repo:microsoft/winget-pkgs is:pr is:open in:title `"$prTitle`"")
                  $search = Invoke-RestMethod "https://api.github.com/search/issues?q=$query" -Headers $headers
                  $existingPr = $search.items | Where-Object { $_.title -eq $prTitle } | Select-Object -First 1
                  if ($existingPr) {
                      Write-Host "WinGet submission already exists: $($existingPr.html_url)"
                      exit 0
                  }

                  $archive = Join-Path $PWD "winget-package/runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz"
                  $checksumFile = "$archive.sha256"
                  $expectedChecksum = ((Get-Content $checksumFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
                  $actualChecksum = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actualChecksum -ne $expectedChecksum) {
                      throw "WinGet manifest artifact checksum mismatch"
                  }

                  $manifestRoot = Join-Path $PWD "winget-manifests"
                  New-Item -ItemType Directory -Path $manifestRoot | Out-Null
                  tar -xzf $archive -C $manifestRoot

                  $wingetCreateVersion = "1.12.13.0"
                  $wingetCreateChecksum = "24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea"
                  $wingetCreate = Join-Path $PWD "wingetcreate.exe"
                  $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/v$wingetCreateVersion/wingetcreate.exe"
                  Invoke-WebRequest $wingetCreateUrl -OutFile $wingetCreate
                  $actualToolChecksum = (Get-FileHash $wingetCreate -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actualToolChecksum -ne $wingetCreateChecksum) {
                      throw "WingetCreate checksum mismatch"
                  }

                  $manifestPath = Join-Path $manifestRoot "Gandazgul.RunWield/$version"
                  & $wingetCreate submit $manifestPath --prtitle $prTitle --no-open
                  if ($LASTEXITCODE -ne 0) {
                      throw "WingetCreate submission failed with exit code $LASTEXITCODE"
                  }

    homebrew-package:
        runs-on: macos-14
        if: needs.metadata.outputs.kind == 'stable'
        needs:
            - metadata
            - release
        concurrency:
            group: homebrew-tap-publication
            cancel-in-progress: false

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.tag }}

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Verify Homebrew tap credential
              env:
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              run: |
                  if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
                    echo "HOMEBREW_TAP_TOKEN is required to publish Stable releases" >&2
                    exit 1
                  fi

            - name: Render Homebrew tap
              run: |
                  deno task package:homebrew \
                    --wld-tag "${{ needs.metadata.outputs.tag }}" \
                    --mnemoteca-tag "v0.3.3" \
                    --output homebrew-tap

            - name: Validate Homebrew tap
              run: deno task package:homebrew:check --tap homebrew-tap

            - name: Archive verified Homebrew tap
              run: |
                  tar -czf "runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz" \
                    -C homebrew-tap Formula README.md runwield-homebrew-package.json
                  shasum -a 256 "runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz" > "runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz.sha256"

            - name: Upload verified Homebrew tap artifact
              uses: actions/upload-artifact@v5
              with:
                  name: runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}
                  path: |
                      runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz
                      runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz.sha256

            - name: Checkout Homebrew tap repository
              uses: actions/checkout@v5
              with:
                  repository: gandazgul/homebrew-tap
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  path: homebrew-tap-publish
                  fetch-depth: 0

            - name: Publish verified Homebrew tap
              run: |
                  cp homebrew-tap/Formula/wld.rb homebrew-tap-publish/Formula/wld.rb
                  cp homebrew-tap/Formula/mnemoteca.rb homebrew-tap-publish/Formula/mnemoteca.rb
                  cp homebrew-tap/README.md homebrew-tap-publish/README.md
                  cp homebrew-tap/runwield-homebrew-package.json homebrew-tap-publish/runwield-homebrew-package.json
                  cd homebrew-tap-publish
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add Formula README.md runwield-homebrew-package.json
                  if git diff --cached --quiet; then
                    echo "Homebrew tap already matches ${{ needs.metadata.outputs.tag }}"
                    exit 0
                  fi
                  git commit -m "Update RunWield to ${{ needs.metadata.outputs.tag }}"
                  git push origin HEAD:main
