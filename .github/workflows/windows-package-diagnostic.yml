name: Windows package diagnostic

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to build and test
                required: true
                default: fix/windows-package-check

permissions:
    contents: read

jobs:
    build-windows:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}
                  submodules: recursive

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Generate version file
              env:
                  WLD_BUILD_VERSION: v0.10.1-rc.9
              run: deno run -A scripts/write-version.js

            - name: Cache dependencies
              run: deno cache scripts/compile.js src/cli.ts

            - name: Compile Windows binary
              env:
                  WLD_BUILD_VERSION: v0.10.1-rc.9
              run: deno run -A scripts/compile.js --target x86_64-pc-windows-msvc --output wld.exe

            - name: Package Windows artifact
              run: deno task package:windows --tag v0.10.1-rc.9 --binary wld.exe --output .

            - name: Upload Windows artifact
              uses: actions/upload-artifact@v5
              with:
                  name: diagnostic-windows-package
                  path: |
                      *.zip
                      *.json
                      *.sha256

    check-windows:
        runs-on: windows-latest
        needs: build-windows
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.3

            - name: Download Windows artifact
              uses: actions/download-artifact@v5
              with:
                  name: diagnostic-windows-package
                  path: windows-package

            - name: Run native Windows package checks
              shell: pwsh
              run: |
                  $zip = Get-ChildItem windows-package -Filter "wld-*-windows-x64.zip" | Select-Object -First 1
                  if (-not $zip) { throw "Windows package ZIP not found" }
                  deno task package:windows:check --package $zip.FullName
